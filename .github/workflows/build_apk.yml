name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Android Project Files
      run: flutter create --platforms=android --project-name=milco_logistics .

    - name: Fix AndroidManifest for URL Launcher
      run: |
        python3 -c "
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()
        queries_tag = '''    <queries>
                <intent>
                    <action android:name='android.intent.action.VIEW' />
                    <data android:scheme='https' />
                </intent>
            </queries>
        '''
        content = content.replace('<application', queries_tag + '\n    <application')
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
